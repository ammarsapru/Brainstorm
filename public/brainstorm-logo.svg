<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4a4a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1f1f1f" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#bg)" stroke="url(#border)" stroke-width="6" filter="url(#shadow)"/>
  <rect x="66" y="66" width="380" height="380" rx="84" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
