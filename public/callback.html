<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Complete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .checkmark {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
        }

        h1 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .status {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .instructions {
            background: #f3f4f6;
            border-left: 4px solid #667eea;
            padding: 16px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 24px;
            font-size: 14px;
            color: #374151;
        }

        .instructions strong {
            display: block;
            margin-bottom: 8px;
            color: #1f2937;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #5a67d8;
        }

        button:active {
            transform: scale(0.98);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fee2e2;
            border-left-color: #dc2626;
            color: #7f1d1d;
        }

        .error strong {
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>Sign In Successful</h1>
        <p class="status">You've been successfully authenticated with Google.</p>
        
        <div class="instructions" id="instructions">
            <strong>Next Steps:</strong>
            <p>Switch back to the Brainstorm desktop app to continue. You're now signed in!</p>
        </div>

        <button id="actionButton" onclick="handleAction()">Return to Desktop App</button>
    </div>

    <script>
        // Detect if running in Electron
        const isElectron = navigator.userAgent.toLowerCase().includes('electron');
        
        const container = document.querySelector('.container');
        const instructionsDiv = document.getElementById('instructions');
        const actionButton = document.getElementById('actionButton');

        // Check for auth errors in URL
        const urlParams = new URLSearchParams(window.location.search);
        const errorParam = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');

        if (errorParam || errorDescription) {
            // Show error state
            document.querySelector('.checkmark').textContent = '✕';
            document.querySelector('.checkmark').style.background = '#ef4444';
            document.querySelector('h1').textContent = 'Sign In Failed';
            document.querySelector('.status').textContent = errorDescription || 'An error occurred during sign in.';
            instructionsDiv.className = 'instructions error';
            instructionsDiv.innerHTML = `<strong>Error:</strong><p>${errorDescription || 'Please try again or contact support.'}</p>`;
            actionButton.textContent = 'Go Back';
            actionButton.onclick = () => window.history.back();
        } else if (isElectron) {
            // Electron: close the window after short delay to ensure session is captured
            instructionsDiv.innerHTML = `<strong>Desktop App Detected</strong><p>Closing this window in 3 seconds...</p>`;
            actionButton.textContent = 'Close Now';
            actionButton.onclick = () => window.close();
            
            // Auto-close after 3 seconds
            setTimeout(() => {
                window.close();
            }, 3000);
        } else {
            // Web browser: show redirect option
            instructionsDiv.innerHTML = `<strong>Continue:</strong><p>You'll be redirected to the dashboard shortly.</p>`;
            actionButton.textContent = 'Go to Dashboard';
            actionButton.onclick = () => {
                window.location.href = window.location.origin;
            };

            // Auto-redirect after 3 seconds
            setTimeout(() => {
                window.location.href = window.location.origin;
            }, 3000);
        }
    </script>
</body>
</html>
