<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://generativelanguage.googleapis.com https://api.openai.com https://api.anthropic.com https://fonts.googleapis.com https://fonts.gstatic.com https://huggingface.co https://*.huggingface.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self';">
  <title>Brainstorm</title>
  <link rel="icon" type="image/png" sizes="512x512" href="./brainstorm-logo.png">
  <link rel="icon" type="image/svg+xml" href="./brainstorm-logo.svg">
  <link rel="apple-touch-icon" href="./brainstorm-logo.png">
  <script>
    // FORCE UNREGISTER SERVICE WORKER to clear stale cache
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bebas+Neue&family=Caveat:wght@400;700&family=Comic+Neue:wght@400;700&family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Manrope:wght@200;300;400;500;600;700;800&family=Merriweather:wght@300;400;700&family=Patrick+Hand&family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@300;400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <div id="root"></div>
  <!-- env.js is only present in Docker deployments; fails silently elsewhere -->
  <script src="./env.js" onerror="window.__APP_ENV__=window.__APP_ENV__||{}"></script>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
