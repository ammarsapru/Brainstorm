<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://generativelanguage.googleapis.com https://api.openai.com https://api.anthropic.com https://api.stripe.com https://fonts.googleapis.com https://fonts.gstatic.com https://huggingface.co https://*.huggingface.co; worker-src 'self' blob:; frame-src https: blob:; object-src 'none'; base-uri 'self';">
  <meta name="description" content="The infinite canvas for brainstorming. Create idea cards, connect thoughts, and let AI expand your ideas into actionable plans.">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brainstorm">
  <meta property="og:title" content="Brainstorm — Infinite Canvas for Ideas">
  <meta property="og:description" content="The mind-mapping tool that thinks with you. Create cards, connect ideas, and let AI expand your thoughts into actionable plans.">
  <meta property="og:image" content="https://ammarsapru.github.io/Brainstorm/brainstorm-logo.png">
  <meta property="og:url" content="https://ammarsapru.github.io/Brainstorm/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Brainstorm">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Brainstorm — Infinite Canvas for Ideas">
  <meta name="twitter:description" content="The mind-mapping tool that thinks with you. Create cards, connect ideas, and let AI expand your thoughts.">
  <meta name="twitter:image" content="https://ammarsapru.github.io/Brainstorm/brainstorm-logo.png">
  <link rel="manifest" href="./manifest.json">
  <title>Brainstorm</title>
  <link rel="icon" type="image/png" sizes="512x512" href="./brainstorm-logo.png">
  <link rel="icon" type="image/svg+xml" href="./brainstorm-logo.svg">
  <link rel="apple-touch-icon" href="./brainstorm-logo.png">
  <script>
    // FORCE UNREGISTER SERVICE WORKER to clear stale cache
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bebas+Neue&family=Caveat:wght@400;700&family=Comic+Neue:wght@400;700&family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Manrope:wght@200;300;400;500;600;700;800&family=Merriweather:wght@300;400;700&family=Patrick+Hand&family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@300;400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <div id="root"></div>
  <!-- env.js is only present in Docker deployments; fails silently elsewhere -->
  <script src="./env.js" onerror="window.__APP_ENV__=window.__APP_ENV__||{}"></script>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
