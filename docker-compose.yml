
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - brainstorm

  brainstorm:
    image: brainstorm-app:0.0.1
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    container_name: brainstorm-app
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run
    read_only: true

volumes:
  caddy_data:
  caddy_config:
